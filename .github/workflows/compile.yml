name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          libnetcdf-dev \
          libnetcdf-c++4-dev \
          libyaml-cpp-dev \
          libboost-all-dev \
          libfmt-dev \
          libeigen3-dev
        
        # Catch2 - download and install from source (static build)
        cd /tmp
        rm -rf Catch2
        git clone --depth 1 --branch v3.7.0 https://github.com/catchorg/Catch2.git
        cd Catch2
        cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF
        cd build
        make -j$(nproc)
        sudo make install
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: |
        cd Code.v05-00
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=
    
    - name: Build Core and KPP libraries only
      run: |
        cd Code.v05-00/build
        # Build only Core and KPP - verify they succeeded
        cmake --build . --target Core || true
        cmake --build . --target KPP || true
        # Verify libraries exist
        ls -la src/Core/libCore.a src/KPP/libKPP.a
        echo "Core and KPP libraries built!"